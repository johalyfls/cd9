<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CD9 - Música</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f9b7b7, #7bd5ff); /* Rosa suave y pastel */
            color: #4b0082; /* Color morado oscuro */
            text-align: center;
        }

        header {
            padding: 20px;
            font-size: 30px;
            font-weight: bold;
            color: #fff;
            background-color: #2e97c7; /* Rosa más intenso */
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .description {
            margin-bottom: 20px;
            font-size: 18px;
            line-height: 1.5;
            color: #4b0082;
        }

        .songs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .song {
            background: #fff;
            color: #4b0082;
            padding: 10px;
            border-radius: 15px;
            width: 250px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .song img {
            width: 100%;
            border-radius: 10px;
        }

        button {
            background: #ff7bbf; /* Rosa más intenso */
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background: #ff5e97; /* Rosa más oscuro */
        }
    </style>
</head>
<body>
    <header>CD9 - Música</header>
    <div class="container">
        <p class="description">CD9 es un grupo mexicano de música pop conocido por su estilo único y su presencia en redes sociales. ¡Explora sus mejores canciones y descubre más sobre este talentoso grupo!</p>
        <p><strong>Creado por:</strong> Johaly Flores Palomares</p>
        <p>Descubre las canciones más populares de CD9.</p>
        <button onclick="fetchSongs()">Cargar Canciones</button>
        <div class="songs" id="songsContainer"></div>
    </div>

    <script>
        async function fetchSongs() {
            const response = await fetch('https://itunes.apple.com/search?term=cd9&media=music&limit=6');
            const data = await response.json();
            const songsContainer = document.getElementById('songsContainer');
            songsContainer.innerHTML = '';
            data.results.forEach(song => {
                const songDiv = document.createElement('div');
                songDiv.classList.add('song');
                songDiv.innerHTML = `
                    <img src="${song.artworkUrl100}" alt="${song.trackName}">
                    <h3>${song.trackName}</h3>
                    <p>${song.artistName}</p>
                    <button onclick="window.open('${song.trackViewUrl}', '_blank')">Escuchar</button>
                `;
                songsContainer.appendChild(songDiv);
            });
        }
    </script>

    <!-- Watson Assistant Script -->
    <script>
        window.watsonAssistantChatOptions = {
            integrationID: "1f80823a-38b4-42c6-98b5-e2b6e11505df", // El ID de esta integración
            region: "au-syd", // Región donde se encuentra tu integración
            serviceInstanceID: "d26abc66-e923-4847-90e1-b1e6cc476252", // ID de tu instancia de servicio
            onLoad: async (instance) => { await instance.render(); }
        };
        setTimeout(function(){
            const t=document.createElement('script');
            t.src="https://web-chat.global.assistant.watson.appdomain.cloud/versions/" + (window.watsonAssistantChatOptions.clientVersion || 'latest') + "/WatsonAssistantChatEntry.js";
            document.head.appendChild(t);
        });
    </script>
</body>
</html>
